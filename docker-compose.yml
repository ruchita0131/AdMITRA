version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: admitra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: admitra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: admitra-redis

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: admitra-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=admitra
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=8a3c94f5d2b7e16a90c4f8d2b7e16a90c4f8d2b7e16a90c4f8d2b7e16a90c4f8d2b7e16a90c4f8d2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admitra-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
